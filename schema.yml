components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - name
      - updated_at
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        recipientId:
          type: string
          format: uuid
        recipientType:
          type: string
        type:
          type: string
          maxLength: 50
        title:
          type: string
          maxLength: 255
        message:
          type: string
        isRead:
          type: boolean
          readOnly: true
        metadata:
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - id
      - isRead
      - message
      - recipientId
      - recipientType
      - title
      - type
      - updatedAt
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        seller:
          allOf:
          - $ref: '#/components/schemas/SellerPublic'
          readOnly: true
        payment:
          allOf:
          - $ref: '#/components/schemas/Payment'
          readOnly: true
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        shipping_address:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - items
      - payment
      - seller
      - shipping_address
      - updated_at
      - user
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        created_at:
          type: string
          format: date-time
        order:
          type: string
          format: uuid
      required:
      - id
      - order
      - price
      - product
    OrderStatusEnum:
      enum:
      - PENDING
      - PAID
      - SHIPPED
      - DELIVERED
      - CANCELLED
